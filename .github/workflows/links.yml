name: Check external links

on:
  schedule:
    - cron: "0 21 * * 0" # 毎週月曜 06:00 JST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    # 普段は2〜4分。2026-09-28 に出力のないまま2時間止まった回があったので、既定の6時間を待たずに打ち切る
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check links
        run: node scripts/check-links.mjs
